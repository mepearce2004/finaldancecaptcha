<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DanceCAPTCHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--surface:#0d0d1a;--surface2:#12121f;
  --border:rgba(255,255,255,0.07);--text:#f0eff8;
  --muted:rgba(240,239,248,0.4);--dim:rgba(240,239,248,0.15);
  --c-pink:#ff3de8;--c-yellow:#ffe83d;--c-blue:#3ddfff;--c-green:#3dff8f;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 60% at 25% 50%,rgba(255,61,232,0.07) 0%,transparent 70%),
    radial-gradient(ellipse 55% 60% at 75% 50%,rgba(61,223,255,0.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.page{
  position:relative;z-index:1;height:100vh;
  display:grid;
  grid-template-rows:56px 1fr 56px;
  grid-template-columns:1fr 1fr;
  grid-template-areas:"hd hd" "ln cm" "ft ft";
}
/* HEADER */
header{
  grid-area:hd;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid var(--border);
  background:rgba(7,7,15,0.88);backdrop-filter:blur(14px);z-index:10;
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.1em}
.logo span{color:var(--c-pink)}
.hdr-right{display:flex;align-items:center;gap:18px}
/* Just Dance star bar */
.jd-bar{
  display:flex;align-items:center;gap:0;
  background:linear-gradient(90deg,#0a1a2e,#0d2a3a);
  border:2px solid #1a4a6a;
  border-radius:30px;
  padding:4px 14px 4px 6px;
  position:relative;
  box-shadow:0 0 12px rgba(0,180,255,0.2), inset 0 0 8px rgba(0,0,0,0.4);
  height:38px;
  min-width:200px;
}
.jd-bar::before{
  content:'';position:absolute;inset:2px;border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent);
  pointer-events:none;
}
/* arrow tail on right */
.jd-bar::after{
  content:'';position:absolute;right:-18px;top:50%;transform:translateY(-50%);
  width:0;height:0;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  border-left:18px solid #1a4a6a;
}
.jd-icon{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,#0af,#055);
  border:2px solid #0cf;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:8px;
  box-shadow:0 0 10px rgba(0,200,255,0.5);
  position:relative;z-index:1;
}
.jd-icon svg{width:16px;height:16px;color:#fff}
.jd-stars{display:flex;align-items:center;gap:3px;position:relative;z-index:1}
.jd-star{
  width:26px;height:26px;position:relative;
  transition:all 0.35s cubic-bezier(.34,1.56,.64,1);
}
.jd-star svg{width:26px;height:26px;display:block}
.jd-star.lit svg .star-fill{fill:#ffd700;filter:drop-shadow(0 0 6px #ffd700)}
.jd-star.lit{transform:scale(1.15)}
.jd-star.unlit svg .star-fill{fill:rgba(255,255,255,0.12)}
.badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;padding:3px 11px;border-radius:20px;border:1px solid var(--border);color:var(--muted);transition:all .3s}
.badge.live{border-color:var(--c-pink);color:var(--c-pink);box-shadow:0 0 14px rgba(255,61,232,.3)}
.badge.done{border-color:var(--c-green);color:var(--c-green);box-shadow:0 0 14px rgba(61,255,143,.3)}

/* LANE */
.lane{grid-area:ln;position:relative;overflow:hidden;border-right:1px solid var(--border);}
.lane-lbl{position:absolute;top:12px;left:14px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);z-index:5;}
.lane-lines{
  position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent,transparent 59px,rgba(255,255,255,.025) 60px);
  animation:lines-scroll 1.4s linear infinite;pointer-events:none;
}
@keyframes lines-scroll{from{background-position:0 0}to{background-position:0 60px}}

/* HIT ZONE */
.hit-zone{
  position:absolute;bottom:0;left:0;right:0;height:190px;
  border-top:2px solid rgba(255,255,255,.08);
  z-index:4;pointer-events:none;transition:border-color .3s,box-shadow .3s;
}
.hit-zone::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(255,255,255,.025),transparent);}
.hz-label{
  position:absolute;top:10px;left:0;right:0;text-align:center;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.15);transition:color .3s;
}

/* QUEUE DOTS */
.qdots{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:7px;z-index:5;}
.qdot{width:7px;height:7px;border-radius:50%;opacity:.2;transition:opacity .3s,transform .3s}
.qdot.cur{opacity:1;transform:scale(1.4)}
.qdot.done{opacity:.08}

/* POSE CARD — uses real silhouette images */
.pose-card{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  z-index:3;pointer-events:none;
}
.card-body{
  width:150px;height:150px;border-radius:16px;
  border:2px solid currentColor;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  transition:box-shadow .3s;
}
.card-img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  border-radius:14px;
  /* invert black bg to transparent: use mix-blend-mode so black disappears */
  mix-blend-mode:screen;
}
/* overlay tint to match color */
.card-tint{
  position:absolute;inset:0;border-radius:14px;
  background:currentColor;opacity:0;
  pointer-events:none;transition:opacity .3s;
  mix-blend-mode:color;
}
.card-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:currentColor;opacity:.75}

.pose-card.hitting .card-body{
  animation:card-pulse .55s ease-in-out infinite alternate;
}
@keyframes card-pulse{
  from{box-shadow:0 0 0 0 currentColor}
  to  {box-shadow:0 0 30px 8px currentColor}
}
.pose-card.hit-done{opacity:0;transition:opacity .35s}

/* CAMERA */
.cam{grid-area:cm;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.cam-lbl{position:absolute;top:12px;left:14px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);z-index:5}
#vid{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scaleX(-1);display:none;
  opacity:.88;
  filter: saturate(1.4) contrast(1.1) hue-rotate(160deg) brightness(0.85);
  mix-blend-mode: normal;
}

/* colour duotone overlay on top of camera */
.cam-tint{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,180,255,0.18) 0%,rgba(255,61,232,0.14) 100%);
  mix-blend-mode:screen;
}

/* vignette */
.cam-vignette{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 50%,rgba(0,0,20,0.72) 100%);
}

/* RGB chromatic aberration lines */
.cam-aberration{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.06) 2px,
    rgba(0,0,0,0.06) 4px
  );
}

/* corner brackets */
.cam-brackets{
  position:absolute;inset:0;z-index:6;pointer-events:none;
}
.cam-brackets::before,
.cam-brackets::after{
  content:'';position:absolute;width:28px;height:28px;
}
.cam-brackets::before{
  top:14px;left:14px;
  border-top:2px solid var(--c-pink);
  border-left:2px solid var(--c-pink);
  box-shadow: -2px -2px 8px rgba(255,61,232,0.4);
}
.cam-brackets::after{
  bottom:14px;right:14px;
  border-bottom:2px solid var(--c2);
  border-right:2px solid var(--c2);
  box-shadow: 2px 2px 8px rgba(61,223,255,0.4);
}
/* extra corners via inner divs */
.cam-corner-tr{
  position:absolute;top:14px;right:14px;width:28px;height:28px;
  border-top:2px solid var(--c2);border-right:2px solid var(--c2);
  box-shadow:2px -2px 8px rgba(61,223,255,0.4);
  z-index:6;pointer-events:none;
}
.cam-corner-bl{
  position:absolute;bottom:14px;left:14px;width:28px;height:28px;
  border-bottom:2px solid var(--c-pink);border-left:2px solid var(--c-pink);
  box-shadow:-2px 2px 8px rgba(255,61,232,0.4);
  z-index:6;pointer-events:none;
}

/* live indicator dot */
.cam-live{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  z-index:7;pointer-events:none;
  display:none;align-items:center;gap:5px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--c-pink);
}
.cam-live.on{display:flex}
.cam-live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c-pink);
  animation:livepulse 1.2s ease-in-out infinite;
  box-shadow:0 0 6px var(--c-pink);
}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}

.cam-idle{display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.cam-ring{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.cam-ring svg{opacity:.28}
.cam-txt{font-size:14px;color:var(--muted);text-align:center;line-height:1.5}
.allow-btn{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;padding:9px 22px;border-radius:24px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--text);cursor:pointer;transition:all .2s}
.allow-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35)}

.scan{position:absolute;left:0;right:0;height:2px;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s}
.scan.on{opacity:1;animation:scan-move 3.2s linear infinite}
@keyframes scan-move{from{top:0}to{top:100%}}

/* Ghost silhouette overlay on camera */
.cam-ghost{
  position:absolute;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .5s;
}
.cam-ghost.on{opacity:1}
.ghost-img{
  width:60%;height:70%;object-fit:contain;
  mix-blend-mode:screen;opacity:.22;filter:blur(1.5px);
}

.cam-hint{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .4s}
.cam-hint.on{opacity:1}
.hint-chip{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 16px;border-radius:20px;border:1px solid currentColor;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);color:currentColor}

/* FOOTER */
footer{grid-area:ft;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid var(--border);background:rgba(7,7,15,0.88);backdrop-filter:blur(14px);z-index:10;gap:20px}
.ft-tags{display:flex;align-items:center;gap:18px}
.ft-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:5px}
.ft-dot{width:3px;height:3px;border-radius:50%;background:var(--dim)}
.match-bar{flex:1;max-width:220px}
.match-top{display:flex;justify-content:space-between;margin-bottom:5px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.match-track{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.match-fill{height:100%;border-radius:2px;width:0%;background:var(--c-pink);transition:width .2s ease,background .3s}
.start-btn{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.1em;padding:9px 34px;border-radius:28px;border:1px solid var(--c-pink);background:rgba(255,61,232,.1);color:var(--c-pink);cursor:pointer;transition:all .2s;box-shadow:0 0 20px rgba(255,61,232,.15);white-space:nowrap}
.start-btn:hover:not([disabled]){background:rgba(255,61,232,.22);box-shadow:0 0 32px rgba(255,61,232,.3)}
.start-btn[disabled]{opacity:.3;cursor:default;pointer-events:none}

/* COUNTDOWN */
.cd-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .15s;background:rgba(7,7,15,.72);backdrop-filter:blur(5px)}
.cd-overlay.show{opacity:1;pointer-events:all}
.cd-num{font-family:'Bebas Neue',sans-serif;font-size:180px;color:var(--text);letter-spacing:-.02em;text-shadow:0 0 80px rgba(255,255,255,.18);animation:num-pop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes num-pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}

/* SUCCESS */
.success-screen{position:fixed;inset:0;background:rgba(7,7,15,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;backdrop-filter:blur(12px)}
.success-screen.show{display:flex}
.s-ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--c-green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(61,255,143,.35);animation:pop-in .5s cubic-bezier(.34,1.56,.64,1) both}
.s-ring svg{color:var(--c-green)}
@keyframes pop-in{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.s-title{font-family:'Bebas Neue',sans-serif;font-size:62px;letter-spacing:.06em;color:var(--c-green);text-shadow:0 0 40px rgba(61,255,143,.4);animation:pop-in .5s .1s cubic-bezier(.34,1.56,.64,1) both}
.s-sub{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(61,255,143,.45);animation:pop-in .5s .2s both}
.retry-btn{margin-top:10px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;padding:10px 30px;border-radius:26px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;animation:pop-in .5s .3s both}
.retry-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* PARTICLES */
.burst{position:fixed;pointer-events:none;z-index:200}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;animation:burst-fly .7s ease-out forwards}
@keyframes burst-fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
</style>
</head>
<body>

<div class="cd-overlay" id="cdOverlay"><div class="cd-num" id="cdNum">3</div></div>

<div class="success-screen" id="successScreen">
  <div class="s-ring">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div class="s-title">You're Human!</div>
  <div class="s-sub">Identity verified · Access granted</div>
  <button class="retry-btn" id="retryBtn">Try again</button>
</div>

<div class="page">
  <header>
    <div class="logo">Dance<span>CAPTCHA</span></div>
    <div class="hdr-right">
      <div class="jd-bar">
        <div class="jd-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="jd-stars" id="jdStars">
          <div class="jd-star unlit" id="star0"><svg viewBox="0 0 24 24"><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
          <div class="jd-star unlit" id="star1"><svg viewBox="0 0 24 24"><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
          <div class="jd-star unlit" id="star2"><svg viewBox="0 0 24 24"><polygon class="star-fill" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
        </div>
      </div>
      <div class="badge" id="badge">Waiting</div>
    </div>
  </header>

  <section class="lane" id="lane">
    <div class="lane-lbl">Incoming moves</div>
    <div class="lane-lines"></div>
    <div class="qdots" id="qdots"></div>
    <div class="hit-zone" id="hitZone">
      <div class="hz-label" id="hzLabel">get ready</div>
    </div>
  </section>

  <section class="cam" id="cam">
    <div class="cam-lbl">Your camera</div>
    <video id="vid" autoplay playsinline muted></video>
    <div class="cam-tint"></div>
    <div class="cam-vignette"></div>
    <div class="cam-aberration"></div>
    <div class="cam-brackets"></div>
    <div class="cam-corner-tr"></div>
    <div class="cam-corner-bl"></div>
    <div class="cam-live" id="camLive"><div class="cam-live-dot"></div>live</div>
    <div class="scan" id="scan"></div>
    <div class="cam-idle" id="camIdle">
      <div class="cam-ring">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
        </svg>
      </div>
      <div class="cam-txt">Allow camera access<br/>to start the challenge</div>
      <button class="allow-btn" id="allowBtn">Allow camera</button>
    </div>
    <div class="cam-ghost" id="camGhost">
      <img class="ghost-img" id="ghostImg" src="" alt=""/>
    </div>
    <div class="cam-hint" id="camHint">
      <div class="hint-chip" id="hintChip">Match this move</div>
    </div>
  </section>

  <footer>
    <div class="ft-tags">
      <div class="ft-tag"><div class="ft-dot"></div>Teachable Machine</div>
      <div class="ft-tag"><div class="ft-dot"></div>No data stored</div>
      <div class="ft-tag"><div class="ft-dot"></div>Runs in-browser</div>
    </div>
    <div class="match-bar">
      <div class="match-top"><span>Pose match</span><span id="matchPct">—</span></div>
      <div class="match-track"><div class="match-fill" id="matchFill"></div></div>
    </div>
    <button class="start-btn" id="startBtn" disabled>Start</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script>

/* ─── CONFIG ─── */
const TM_MODEL_URL = null; // replace with your Teachable Machine model URL
const TOTAL_POSES  = 3;
const HOLD_MS      = 2400;
const MATCH_THRESH = 0.72;
const FALL_MS      = 3400;

/* ─── POSES — using your real silhouette PNGs ─── */
const POSES = [
  {
    id:'flex-up', name:'Flex Up', color:'#ff3de8',
    img: POSE_IMAGES.pink
  },
  {
    id:'wave', name:'Wave', color:'#ffe83d',
    img: POSE_IMAGES.yellow
  },
  {
    id:'point-up', name:'Point Up', color:'#3ddfff',
    img: POSE_IMAGES.blue
  }
];

/* ─── DOM ─── */
const lane          = document.getElementById('lane');
const hitZone       = document.getElementById('hitZone');
const hzLabel       = document.getElementById('hzLabel');
const qdots         = document.getElementById('qdots');
const vid           = document.getElementById('vid');
const camIdle       = document.getElementById('camIdle');
const allowBtn      = document.getElementById('allowBtn');
const scan          = document.getElementById('scan');
const camGhost      = document.getElementById('camGhost');
const ghostImg      = document.getElementById('ghostImg');
const camLive       = document.getElementById('camLive');
const hintChip      = document.getElementById('hintChip');
const startBtn      = document.getElementById('startBtn');
const badge         = document.getElementById('badge');
function lightStars(n){
  for(let i=0;i<3;i++){
    const s=document.getElementById('star'+i);
    if(!s)return;
    s.className='jd-star '+(i<n?'lit':'unlit');
  }
}
const matchFill     = document.getElementById('matchFill');
const matchPct      = document.getElementById('matchPct');
const cdOverlay     = document.getElementById('cdOverlay');
const cdNum         = document.getElementById('cdNum');
const successScreen = document.getElementById('successScreen');
const retryBtn      = document.getElementById('retryBtn');

/* ─── STATE ─── */
let gs='idle', queue=[], curIdx=-1, done=0;
let simIv=null, holdMs=0, simScore=0, scoreTgt=0;
let cameraOn=false, tmModel=null, raf=null;

/* ─── HELPERS ─── */
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

function setMatch(v){
  simScore=Math.min(100,Math.max(0,v));
  const p=Math.round(simScore);
  matchFill.style.width=p+'%';
  matchPct.textContent=p+'%';
  matchFill.style.background=simScore>72?'#3dff8f':simScore>45?'#ffe83d':'#ff3de8';
}

function setHZ(color){
  hitZone.style.borderTopColor=color||'rgba(255,255,255,.08)';
  hitZone.style.boxShadow=color?`0 -12px 60px ${color}44`:'none';
  hzLabel.style.color=color||'rgba(255,255,255,.15)';
}

/* ─── CAMERA ─── */
allowBtn.addEventListener('click',async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    vid.srcObject=s; vid.style.display='block';
    camIdle.style.display='none';
    scan.classList.add('on');
    cameraOn=true; startBtn.disabled=false;
    camLive.classList.add('on');
    badge.textContent='Ready';
    if(TM_MODEL_URL&&window.tmPose){
      try{ tmModel=await tmPose.load(TM_MODEL_URL+'model.json',TM_MODEL_URL+'metadata.json'); }
      catch(e){ tmModel=null; }
    }
  }catch(e){ camIdle.querySelector('.cam-txt').textContent='Camera access denied.'; }
});

/* ─── START / RETRY ─── */
startBtn.addEventListener('click',()=>{ if(cameraOn) beginCD(); });
retryBtn.addEventListener('click',()=>{ successScreen.classList.remove('show'); resetGame(); });

function resetGame(){
  gs='idle'; done=0; curIdx=-1; queue=[];
  lightStars(0); setMatch(0); matchPct.textContent='—';
  badge.textContent='Ready'; badge.className='badge';
  hzLabel.textContent='get ready'; setHZ(null);
  camHint.classList.remove('on'); camGhost.classList.remove('on');
  qdots.innerHTML='';
  lane.querySelectorAll('.pose-card').forEach(c=>c.remove());
  startBtn.disabled=false;
  if(simIv)clearInterval(simIv);
  if(raf)cancelAnimationFrame(raf);
}

/* ─── COUNTDOWN ─── */
function beginCD(){
  startBtn.disabled=true; gs='countdown';
  badge.textContent='Get ready'; badge.className='badge live';
  queue=shuffle(POSES).slice(0,TOTAL_POSES);
  buildDots();
  cdOverlay.classList.add('show');
  let n=3; cdNum.textContent=n; animCD();
  const t=setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(t); cdOverlay.classList.remove('show'); startPlaying(); }
    else{ cdNum.textContent=n; animCD(); }
  },900);
}
function animCD(){ cdNum.style.animation='none'; void cdNum.offsetWidth; cdNum.style.animation='num-pop .7s cubic-bezier(.34,1.56,.64,1)'; }

/* ─── DOTS ─── */
function buildDots(){
  qdots.innerHTML='';
  queue.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='qdot'; d.id=`qd${i}`;
    d.style.background=p.color; d.style.boxShadow=`0 0 6px ${p.color}`;
    qdots.appendChild(d);
  });
}
function refreshDots(){
  queue.forEach((_,i)=>{
    const d=document.getElementById(`qd${i}`);
    if(!d)return; d.className='qdot';
    if(i<done) d.classList.add('done');
    else if(i===curIdx) d.classList.add('cur');
  });
}

/* ─── PLAY ─── */
function startPlaying(){ gs='playing'; badge.textContent='GO!'; dropNext(0); }

function dropNext(idx){
  if(idx>=TOTAL_POSES){ triggerWin(); return; }
  curIdx=idx; refreshDots();
  const pose=queue[idx];

  // camera side
  scan.style.background=`linear-gradient(90deg,transparent,${pose.color}55,transparent)`;
  hintChip.style.color=pose.color; hintChip.style.borderColor=pose.color;
  hintChip.textContent=pose.name;
  ghostImg.src=pose.img;
  setHZ(pose.color);

  // remove old cards
  lane.querySelectorAll('.pose-card').forEach(c=>c.remove());

  // build card with real image
  const card=document.createElement('div');
  card.className='pose-card';
  card.style.color=pose.color;
  card.innerHTML=`
    <div class="card-body">
      <img class="card-img" src="${pose.img}" alt="${pose.name}"/>
      <div class="card-tint"></div>
    </div>
    <div class="card-lbl">${pose.name}</div>
  `;
  lane.insertBefore(card,hitZone);

  const laneH  = lane.clientHeight;
  const hzH    = 190;
  const cardH  = 170;
  const startY = -cardH - 20;
  const landY  = laneH - hzH + hzH/2 - cardH/2 - 14;
  card.style.top = startY+'px';

  const t0=performance.now();
  let landed=false;

  function fall(now){
    if(gs!=='playing'||curIdx!==idx) return;
    const p=Math.min(1,(now-t0)/FALL_MS);
    const e=1-Math.pow(1-p,4); // ease out quart
    card.style.top=(startY+(landY-startY)*e)+'px';
    if(p<1){ raf=requestAnimationFrame(fall); }
    else if(!landed){
      landed=true;
      card.classList.add('hitting');
      camHint.classList.add('on');
      camGhost.classList.add('on');
      hzLabel.textContent='hold the pose';
      holdMs=0; simScore=0; scoreTgt=0;
      runScoring(idx, pose, ()=>{
        done++; lightStars(done);
        card.classList.remove('hitting');
        card.classList.add('hit-done');
        camHint.classList.remove('on');
        camGhost.classList.remove('on');
        burstEffect(pose.color);
        refreshDots(); setMatch(0); holdMs=0;
        setTimeout(()=>{ card.remove(); if(gs==='playing') dropNext(idx+1); }, 420);
      });
    }
  }
  raf=requestAnimationFrame(fall);
}

/* ─── SCORING ─── */
function runScoring(idx, pose, onWin){
  if(simIv) clearInterval(simIv);
  holdMs=0; setMatch(0); scoreTgt=0;

  if(tmModel){
    async function tmLoop(){
      if(gs!=='playing'||curIdx!==idx) return;
      try{
        const {posenetOutput}=await tmModel.estimatePose(vid);
        const preds=await tmModel.predict(posenetOutput);
        const match=preds.find(p=>p.className.toLowerCase().includes(pose.id));
        const conf=match?match.probability*100:0;
        setMatch(conf);
        if(conf>=MATCH_THRESH*100){
          holdMs+=100;
          const pct=Math.min(100,Math.round((holdMs/HOLD_MS)*100));
          hzLabel.textContent=`hold — ${pct}%`;
          if(holdMs>=HOLD_MS){ onWin(); return; }
        } else { holdMs=Math.max(0,holdMs-60); hzLabel.textContent='match the pose'; }
      }catch(e){}
      setTimeout(tmLoop,100);
    }
    tmLoop(); return;
  }

  // Simulation
  setTimeout(()=>{ if(curIdx===idx) scoreTgt=42+Math.random()*18; },400);
  setTimeout(()=>{ if(curIdx===idx) scoreTgt=62+Math.random()*14; },1000);
  setTimeout(()=>{ if(curIdx===idx) scoreTgt=77+Math.random()*15; },1800);

  simIv=setInterval(()=>{
    if(gs!=='playing'||curIdx!==idx){ clearInterval(simIv); return; }
    const diff=scoreTgt-simScore;
    simScore=Math.min(100,Math.max(0,simScore+diff*.1+(Math.random()-.5)*2.5));
    setMatch(simScore);
    if(simScore>=MATCH_THRESH*100){
      holdMs+=80;
      const pct=Math.min(100,Math.round((holdMs/HOLD_MS)*100));
      hzLabel.textContent=`hold — ${pct}%`;
      if(holdMs>=HOLD_MS){ clearInterval(simIv); onWin(); }
    } else {
      holdMs=Math.max(0,holdMs-55);
      hzLabel.textContent=simScore>55?'almost...':'match the pose';
    }
  },80);
}

/* ─── WIN ─── */
function triggerWin(){
  gs='success'; setHZ(null);
  camHint.classList.remove('on'); camGhost.classList.remove('on');
  badge.textContent='Done!'; badge.className='badge done';
  hzLabel.textContent='complete!';
  if(simIv) clearInterval(simIv);
  setTimeout(()=>successScreen.classList.add('show'),700);
}

/* ─── PARTICLES ─── */
function burstEffect(color){
  const hz=hitZone.getBoundingClientRect();
  const cx=hz.left+hz.width/2, cy=hz.top+hz.height/2;
  const wrap=document.createElement('div');
  wrap.className='burst'; wrap.style.left=cx+'px'; wrap.style.top=cy+'px';
  document.body.appendChild(wrap);
  for(let i=0;i<20;i++){
    const pt=document.createElement('div'); pt.className='pt';
    const ang=(i/20)*360, r=55+Math.random()*70;
    const rad=ang*Math.PI/180;
    pt.style.setProperty('--tx',Math.cos(rad)*r+'px');
    pt.style.setProperty('--ty',Math.sin(rad)*r+'px');
    pt.style.background=color; pt.style.left='-3.5px'; pt.style.top='-3.5px';
    pt.style.animationDelay=Math.random()*.08+'s';
    wrap.appendChild(pt);
  }
  setTimeout(()=>wrap.remove(),900);
}
</script>
